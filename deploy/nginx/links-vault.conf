# Link Vault API server blocks for the Hetzner host's NGINX.
# Paste into the http {} block of /etc/nginx/nginx.conf, next to the other sites. That
# http {} block already sets proxy_http_version, the Host / X-Real-IP / X-Forwarded-*
# headers and proxy_read_timeout, so they aren't repeated here.
#
# Order matters, because the 443 block points at a certificate that must already cover
# links-api.* (README "Deployment" has the full steps):
#   1. Add only the port-80 block, then: sudo nginx -t && sudo systemctl reload nginx
#   2. sudo certbot --nginx --expand -d hetzner.pratham82.in -d api.hetzner.pratham82.in \
#        -d links-api.hetzner.pratham82.in
#   3. Add the 443 block, then: sudo nginx -t && sudo systemctl reload nginx

# ================== Link Vault API: links-api.hetzner.pratham82.in ==================
server {
    listen 80;
    server_name links-api.hetzner.pratham82.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name links-api.hetzner.pratham82.in;

    # Same SAN cert lineage as the other sites; certbot --expand adds links-api.* to it.
    ssl_certificate     /etc/letsencrypt/live/hetzner.pratham82.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hetzner.pratham82.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # WhatsApp exports can be up to 25 MB (MAX_UPLOAD_BYTES in app/services/imports.py).
    # NGINX's default limit is 1 MB and would reject them with 413 before the API sees them.
    client_max_body_size 26m;

    # FastAPI (uvicorn) container, bound to loopback by docker-compose.server.yml.
    # Keep the port in sync with API_HOST_PORT.
    location / {
        proxy_pass http://127.0.0.1:8200;
    }
}
