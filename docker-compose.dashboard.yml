# Just the dashboard, for running on the Mac against the hosted API.
#
#   docker compose -f docker-compose.dashboard.yml up -d --build
#
# Needs API_KEY (the server's) and DASHBOARD_API_BASE_URL in .env. The dashboard calls the
# API from its own server, so the key never reaches the browser.
name: links-vault-dashboard

services:
  web:
    build: ./web
    env_file: .env
    environment:
      API_BASE_URL: ${DASHBOARD_API_BASE_URL:?set DASHBOARD_API_BASE_URL in .env, e.g. https://links-api.hetzner.pratham82.in}
    ports:
      - "3000:3000"
    restart: unless-stopped
