services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: linkvault
      POSTGRES_PASSWORD: linkvault
      POSTGRES_DB: linkvault
    ports:
      # Localhost only, so tests and tools on the host can reach it. Set POSTGRES_PORT
      # if something else (e.g. a Homebrew Postgres) already uses 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkvault -d linkvault"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      THUMBNAIL_DIR: /data/thumbnails
    ports:
      - "8000:8000"
    volumes:
      # The worker writes thumbnails here; the API serves them at /thumbnails/{file}.
      - thumbnails:/data/thumbnails
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    # Same image as the API. Enriches pending links (previews, types, thumbnails).
    build: ./backend
    env_file: .env
    command: ["python", "-m", "app.worker"]
    environment:
      THUMBNAIL_DIR: /data/thumbnails
    volumes:
      - thumbnails:/data/thumbnails
    depends_on:
      # The api container applies migrations on startup; the worker retries until they exist.
      - api
    restart: unless-stopped

  bot:
    # Same image as the API; the bot calls the API at API_BASE_URL over HTTP.
    build: ./backend
    env_file: .env
    command: ["python", "-m", "app.bot.telegram"]
    environment:
      # Set here rather than in .env so the bot always finds the api container.
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  web:
    # Next.js dashboard. Talks to the api container server-side, with API_KEY from .env.
    build: ./web
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  thumbnails:
