services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: linkvault
      POSTGRES_PASSWORD: linkvault
      POSTGRES_DB: linkvault
    ports:
      # Localhost only, so tests and tools on the host can reach it. Set POSTGRES_PORT
      # if something else (e.g. a Homebrew Postgres) already uses 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkvault -d linkvault"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  bot:
    # Same image as the API; the bot calls the API at API_BASE_URL over HTTP.
    build: ./backend
    env_file: .env
    command: ["python", "-m", "app.bot.telegram"]
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
